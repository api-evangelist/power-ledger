  note: No public SLA. Powerledger contracts its platform with utilities and retailers directly.
platform_transitions:
- name: Powerledger Energy Blockchain to Solana mainnet
  kind: platform-migration
  announced_by: https://powerledger.io/blockchain-technology/
  quote: >-
    "we have evolved from our own blockchain to integrating with Solana mainnet, harnessing
    the full potential of Solana's network and ecosystem capabilities for Powerledger's
    products"
  effect_on_developers: >-
    The Powerledger Energy Blockchain was a permissioned Solana-derived chain with its own
    JSON-RPC entrypoint. The POWR token now lives on Solana mainnet-beta as an SPL token
    (mint PowerhfyX6JqFprXzy89fPBSKqmLj8Yzcvr3FkHrQHR) and trades on Raydium and Jupiter.
  evidence:
