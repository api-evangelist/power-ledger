name: Powerledger lifecycle
description: >-
  Versioning, deprecation and operational-status posture. Powerledger publishes no API, so
  there is no API version scheme, no Sunset/Deprecation header policy and no SLA to record.
  What it does have is a platform-level migration that this pipeline probed directly: the
  company retired its own permissioned chain in favour of Solana mainnet, and the RPC
  endpoint its own validator documentation still names no longer answers.
api_versioning:
  scheme: null
  note: No public API, therefore no published versioning scheme.
deprecation_policy:
  published: false
  sunset_header: unknown
  note: >-
    No deprecation policy page and no RFC 8594 Sunset/Deprecation header practice is
    documented anywhere on powerledger.io or in the PowerLedger GitHub org. No
    `Deprecation` pointer is emitted in apis.yml.
