aid: power-ledger
name: Powerledger
description: 'Powerledger (Powerledger AG / Power Ledger Pty Ltd, Perth, Western Australia)
  builds software for tracking, tracing and trading renewable energy and environmental
  commodities. Its platform is modular and sold to utilities, retailers, network operators,
  generators and corporates rather than to developers: xGrid and uGrid for peer-to-peer
  energy trading across and behind the meter, TraceX as a marketplace for Renewable Energy
  Certificates and other Energy Attribute Certificates (integrated with the M-RETS and
  ERCOT registries), Vision and PPA Vision for 24/7 renewable portfolio and PPA tracking,
  plus hydrogen and EV settlement products. Powerledger originally ran its own permissioned
  Solana-derived chain (the Powerledger Energy Blockchain, source at github.com/PowerLedger/powr)
  and has since moved to Solana mainnet, where the POWR SPL token lives. As of this profile
  Powerledger publishes no public developer portal, API reference, or machine-readable API
  contract of any kind.'
